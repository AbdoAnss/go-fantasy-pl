name: Release

# Cuts a release by reading the VERSION file: bump VERSION in a PR, merge,
# and this workflow verifies, tags v<VERSION>, and publishes a GitHub
# release with generated notes. Re-tagging is skipped when the tag already
# exists, so merging without a bump is always safe.
#
# Tags are only the published form of a release — Go consumers can also pin
# any untagged commit or branch directly:
#
#   go get github.com/AbdoAnss/go-fantasy-pl@main          # pseudo-version
#   go get github.com/AbdoAnss/go-fantasy-pl@<commit-sha>

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before tagging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

  tag:
    name: Tag and publish VERSION
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so existing tags are visible

      - id: version
        name: Read VERSION and check for an existing tag
        run: |
          ver="$(tr -d '[:space:]' < VERSION)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$ver already tagged, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push tag
        if: steps.version.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "go-fantasy-pl v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Publish GitHub release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --verify-tag
